{% extends "predictor/base.html" %} {% block body_block %}

<style>
  /* Only affects this page */
  .form-row {
    display: flex;
    align-items: center;
    margin-bottom: 15px;
  }

  .form-row label {
    width: 30%;
    margin: 0;
  }

  .form-row .form-field {
    width: 70%;
  }

  .form-row input,
  .form-row select {
    width: 100%;
  }

  .center-wrapper {
    width: 100%;
    display: flex;
    justify-content: center;
  }

  .center-card {
    width: 100%;
    max-width: 600px;
    padding: 20px;
    border: 1px solid #ddd;
    border-radius: 6px;
    background: #fff;
  }
  .travel-option {
    display: flex;
    flex-direction: column;
    margin-bottom: 14px;
  }
  .travel-option {
    display: flex;
    flex-direction: column;
    margin-bottom: 14px;
  }
  .count-input {
    width: 55px;
    height: 34px;
    margin-top: 6px;
    padding: 4px;
    font-size: 1rem;
    text-align: center;
    border-radius: 4px;
  }
</style>

<div class="center-wrapper">
  <div class="center-card">
    <h2 class="text-center mb-4">Passenger Portal</h2>

    <form enctype="multipart/form-data" method="POST">
      {% csrf_token %}

      <!-- Full Name -->
      <div class="form-row">
        <label>{{ user_form.full_name.label }}</label>

        <div class="form-field" style="width: 20%; margin-right: 10px">
          {{ user_form.title }}
        </div>

        <div class="form-field" style="width: 50%">
          {{ user_form.full_name }}
        </div>
      </div>

      <!-- Age -->

      <div class="form-row">
        <label>{{ user_form.age.label }}</label>
        <div class="form-field">{{ user_form.age }}</div>
      </div>

      <!-- Gender -->
      <div class="form-row">
        <label>{{ user_form.gender.label }}</label>
        <div class="form-field">{{ user_form.gender }}</div>
      </div>

      <!-- Travel Class -->
      <div class="form-row">
        <label>{{ user_form.travel_class.label }}</label>
        <div class="form-field">{{ user_form.travel_class }}</div>
      </div>

      <!-- Travelled with -->
      <div class="form-row">
        <label>Travelled</label>

        <!-- Alone -->
        <div class="travel-option">
          <label>{{ user_form.is_alone }} Alone</label>
        </div>

        <!-- With parents -->
        <div class="travel-option">
          <label>{{ user_form.with_parents }} With parents</label>
          <input
            id="parents_count"
            name="parents_count"
            class="count-input"
            placeholder="Specify count"
            min="1"
          />
        </div>

        <!-- With spouse -->
        <div class="travel-option">
          <label>{{ user_form.with_spouse }} With spouse</label>
          <input
            id="spouse_count"
            name="spouse_count"
            class="count-input"
            placeholder="Specify count"
            min="1"
          />
        </div>

        <!-- With children -->
        <div class="travel-option">
          <label>{{ user_form.with_children }} With children</label>
          <input
            id="children_count"
            name="children_count"
            class="count-input"
            placeholder="Specify count"
            min="1"
          />
        </div>

        <!-- With siblings -->
        <div class="travel-option">
          <label>{{ user_form.with_siblings }} With siblings</label>
          <input
            id="siblings_count"
            name="siblings_count"
            class="count-input"
            placeholder="Specify count"
            min="1"
          />
        </div>
      </div>

      <div class="text-center" style="margin-top: 25px">
        <button
          class="btn btn-primary btn-block"
          style="width: 100%"
          type="submit"
        >
          Predict Survival
        </button>
      </div>
    </form>
  </div>
</div>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const alone = document.getElementById("id_is_alone");
    const others = [
      document.getElementById("id_with_parents"),
      document.getElementById("id_with_spouse"),
      document.getElementById("id_with_children"),
      document.getElementById("id_with_siblings"),
      document.getElementById("id_parents_count"),
      document.getElementById("id_spouse_count"),
      document.getElementById("id_children_count"),
      document.getElementById("id_siblings_count"),
    ];

    alone.addEventListener("change", function () {
      if (alone.checked) {
        others.forEach((cb) => {
          cb.checked = false;
          cb.disabled = true;
        });
      } else {
        others.forEach((cb) => (cb.disabled = false));
      }
    });
  });
</script>

{% endblock %}
